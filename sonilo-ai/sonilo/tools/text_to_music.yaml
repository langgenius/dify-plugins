identity:
  name: text_to_music
  author: sonilo-ai
  label:
    en_US: Text to Music
    zh_Hans: 文本生成音乐
description:
  human:
    en_US: >-
      Generate licensed, original music from a text prompt using the Sonilo
      API. Use this for standalone background music, not sound effects and
      not music tied to a specific video.
    zh_Hans: >-
      使用 Sonilo API 根据文本提示生成有版权授权的原创音乐。适用于独立的背景音乐，不适用于音效，也不适用于与特定视频绑定的音乐。
  llm: >-
    Generate original, licensed music from a text description (genre, mood,
    instrumentation, tempo, etc.). Use for background music / soundtracks
    that are not tied to a specific video and are not sound effects. Submits
    the job and polls until it finishes, then returns a downloadable audio
    URL.
extra:
  python:
    source: tools/text_to_music.py
parameters:
  - name: prompt
    type: string
    required: true
    form: llm
    label:
      en_US: Prompt
      zh_Hans: 提示词
    human_description:
      en_US: Description of the music to generate (genre, mood, instruments, tempo, etc.).
      zh_Hans: 要生成音乐的描述（风格、情绪、乐器、节奏等）。
    llm_description: >-
      Natural-language description of the music to generate, e.g. "warm
      lo-fi piano with soft rain ambience, 80 BPM" or "upbeat corporate
      background track with light percussion".
  - name: duration
    type: number
    required: true
    form: llm
    min: 5
    max: 360
    label:
      en_US: Duration (seconds)
      zh_Hans: 时长（秒）
    human_description:
      en_US: Output duration in whole seconds, from 5 to 360.
      zh_Hans: 输出时长（整数秒），范围 5 到 360。
    llm_description: Desired duration of the generated music, in whole seconds, between 5 and 360.
  - name: output_format
    type: select
    required: false
    form: form
    default: m4a
    options:
      - value: m4a
        label:
          en_US: M4A (default)
          zh_Hans: M4A（默认）
      - value: wav
        label:
          en_US: WAV
          zh_Hans: WAV
    label:
      en_US: Output format
      zh_Hans: 输出格式
    human_description:
      en_US: Audio container/codec for the generated file. Only m4a or wav are supported here.
      zh_Hans: 生成音频文件的容器/编码格式。此处仅支持 m4a 或 wav。
output_schema:
  type: object
  properties:
    success:
      type: boolean
      description: Whether an audio URL was successfully resolved.
    audio_url:
      type: string
      nullable: true
      description: URL of the generated music, when available.
    content_type:
      type: string
      nullable: true
      description: Content type of the generated audio file, when reported.
    task_id:
      type: string
      nullable: true
      description: Sonilo task id for this request.
    status:
      type: string
      nullable: true
      description: Final Sonilo task status (e.g. succeeded).
    duration_seconds:
      type: number
      nullable: true
      description: Duration of the generated audio in seconds, when reported.
    cost:
      type: number
      nullable: true
      description: Cost of this generation, when reported.
    raw:
      type: object
      nullable: true
      description: The full, unmodified terminal task body from the Sonilo API.
