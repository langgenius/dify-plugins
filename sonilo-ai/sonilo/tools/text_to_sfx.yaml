identity:
  name: text_to_sfx
  author: sonilo-ai
  label:
    en_US: Text to Sound Effects
    zh_Hans: 文本生成音效
description:
  human:
    en_US: >-
      Generate isolated sound effects, Foley, impacts, ambience, UI sounds,
      or transitions from a text prompt using the Sonilo API. Use this for
      standalone SFX, not background music.
    zh_Hans: >-
      使用 Sonilo API 根据文本提示生成独立的音效、拟音（Foley）、撞击声、环境声、UI 音效或转场音效。适用于独立音效，不适用于背景音乐。
  llm: >-
    Generate an isolated sound effect (Foley, impact, ambience, UI sound,
    transition, etc.) from a text description. Use this instead of
    text_to_music when the user wants a discrete sound effect rather than
    music. Submits the job and polls until it finishes, then returns a
    downloadable audio URL.
extra:
  python:
    source: tools/text_to_sfx.py
parameters:
  - name: prompt
    type: string
    required: true
    form: llm
    label:
      en_US: Prompt
      zh_Hans: 提示词
    human_description:
      en_US: Description of the sound effect to generate.
      zh_Hans: 要生成音效的描述。
    llm_description: >-
      Natural-language description of the sound effect to generate, e.g.
      "glass bottle shattering on concrete", "soft UI click", or "distant
      thunder rolling over rain".
  - name: duration
    type: number
    required: true
    form: llm
    min: 1
    max: 180
    label:
      en_US: Duration (seconds)
      zh_Hans: 时长（秒）
    human_description:
      en_US: Output duration in whole seconds, from 1 to 180.
      zh_Hans: 输出时长（整数秒），范围 1 到 180。
    llm_description: Desired duration of the generated sound effect, in whole seconds, between 1 and 180.
  - name: audio_format
    type: select
    required: false
    form: form
    options:
      - value: wav
        label:
          en_US: WAV
          zh_Hans: WAV
      - value: mp3
        label:
          en_US: MP3
          zh_Hans: MP3
      - value: aac
        label:
          en_US: AAC
          zh_Hans: AAC
      - value: flac
        label:
          en_US: FLAC
          zh_Hans: FLAC
    label:
      en_US: Audio format
      zh_Hans: 音频格式
    human_description:
      en_US: Audio container/codec for the generated file. Leave unset to use Sonilo's default.
      zh_Hans: 生成音频文件的容器/编码格式。留空则使用 Sonilo 的默认值。
output_schema:
  type: object
  properties:
    success:
      type: boolean
      description: Whether an audio URL was successfully resolved.
    audio_url:
      type: string
      nullable: true
      description: URL of the generated sound effect, when available.
    content_type:
      type: string
      nullable: true
      description: Content type of the generated audio file, when reported.
    task_id:
      type: string
      nullable: true
      description: Sonilo task id for this request.
    status:
      type: string
      nullable: true
      description: Final Sonilo task status (e.g. succeeded).
    duration_seconds:
      type: number
      nullable: true
      description: Duration of the generated audio in seconds, when reported.
    cost:
      type: number
      nullable: true
      description: Cost of this generation, when reported.
    raw:
      type: object
      nullable: true
      description: The full, unmodified terminal task body from the Sonilo API.
