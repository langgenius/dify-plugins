identity:
  name: inspect_bank_statement
  author: world-discovery-llp
  label:
    en_US: Inspect bank or payment statement
description:
  human:
    en_US: Inspects an uploaded bank, card or payment statement and returns document scope, account structure, currency,
      balance evidence and compatible accounting export profiles. Inspection does not spend credits or start a paid
      conversion.
  llm: Inspects an uploaded bank, card or payment statement and returns document scope, account structure, currency,
    balance evidence and compatible accounting export profiles. Inspection does not spend credits or start a paid
    conversion. Read-only; select the export profile based on the supportedExportProfiles response.
parameters:
- name: sourceId
  type: string
  required: true
  label:
    en_US: Source reference
  human_description:
    en_US: Source reference for Inspect bank or payment statement. Reuse the exact opaque ID from the immediately
      preceding KontoCSV result; never guess or fabricate one.
  llm_description: Source reference for Inspect bank or payment statement. Reuse the exact opaque ID from the immediately
    preceding KontoCSV result; never guess or fabricate one.
  form: llm
- name: locale
  type: select
  required: false
  label:
    en_US: Language
  human_description:
    en_US: Language for Inspect bank or payment statement.
  llm_description: Language for Inspect bank or payment statement.
  form: llm
  options:
  - value: de
    label:
      en_US: de
  - value: en
    label:
      en_US: en
  - value: fr
    label:
      en_US: fr
  - value: es
    label:
      en_US: es
  - value: it
    label:
      en_US: it
  - value: nl
    label:
      en_US: nl
extra:
  python:
    source: tools/inspect_bank_statement.py
