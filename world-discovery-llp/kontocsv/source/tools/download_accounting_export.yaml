identity:
  name: download_accounting_export
  author: world-discovery-llp
  label:
    en_US: Get validated accounting export
description:
  human:
    en_US: Returns a short-lived download URL for a completed KontoCSV accounting export belonging to the authenticated
      user. A URL is returned only when the job outcome permits a downloadable file.
  llm: Returns a short-lived download URL for a completed KontoCSV accounting export belonging to the authenticated
    user. A URL is returned only when the job outcome permits a downloadable file. Only returns a short-lived URL
    for a completed, eligible export. Never invent export readiness.
parameters:
- name: jobId
  type: string
  required: true
  label:
    en_US: Conversion job ID
  human_description:
    en_US: Conversion job ID for Get validated accounting export. Reuse the exact opaque ID from the immediately
      preceding KontoCSV result; never guess or fabricate one.
  llm_description: Conversion job ID for Get validated accounting export. Reuse the exact opaque ID from the immediately
    preceding KontoCSV result; never guess or fabricate one.
  form: llm
extra:
  python:
    source: tools/download_accounting_export.py
