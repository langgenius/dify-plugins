identity:
  name: get_conversion_status
  author: world-discovery-llp
  label:
    en_US: Check conversion and quality status
description:
  human:
    en_US: Returns the current processing, quality and export-readiness status of an already-started KontoCSV conversion
      job. It does not start a new conversion or charge additional credits.
  llm: Returns the current processing, quality and export-readiness status of an already-started KontoCSV conversion
    job. It does not start a new conversion or charge additional credits. Read-only; repeat only as needed, no background
    polling loop built into the plugin.
parameters:
- name: jobId
  type: string
  required: true
  label:
    en_US: Conversion job ID
  human_description:
    en_US: Conversion job ID for Check conversion and quality status. Reuse the exact opaque ID from the immediately
      preceding KontoCSV result; never guess or fabricate one.
  llm_description: Conversion job ID for Check conversion and quality status. Reuse the exact opaque ID from the
    immediately preceding KontoCSV result; never guess or fabricate one.
  form: llm
extra:
  python:
    source: tools/get_conversion_status.py
