identity:
  name: prepare_bank_statement_conversion
  author: world-discovery-llp
  label:
    en_US: Prepare existing-credit conversion
description:
  human:
    en_US: Prepares a conversion using only the authenticated KontoCSV account's existing service credits. It returns
      the required and available credit counts and a short-lived conversion token only when the existing balance
      is sufficient. No prices, checkout URLs or payment instructions are returned.
  llm: Prepares a conversion using only the authenticated KontoCSV account's existing service credits. It returns
    the required and available credit counts and a short-lived conversion token only when the existing balance is
    sufficient. No prices, checkout URLs or payment instructions are returned. Uses existing credits only. If credits
    are insufficient, do not create a checkout; direct the user to KontoCSV's website.
parameters:
- name: sourceId
  type: string
  required: true
  label:
    en_US: Source reference
  human_description:
    en_US: Source reference for Prepare existing-credit conversion. Reuse the exact opaque ID from the immediately
      preceding KontoCSV result; never guess or fabricate one.
  llm_description: Source reference for Prepare existing-credit conversion. Reuse the exact opaque ID from the immediately
    preceding KontoCSV result; never guess or fabricate one.
  form: llm
