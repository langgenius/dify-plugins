identity:
  name: complete_browser_upload
  author: world-discovery-llp
  label:
    en_US: Check completed browser upload
description:
  human:
    en_US: Checks whether a previously created KontoCSV browser upload has completed and returns a user-bound source
      reference based on the uploaded object's stored metadata. This does not start a conversion or spend credits.
  llm: Checks whether a previously created KontoCSV browser upload has completed and returns a user-bound source
    reference based on the uploaded object's stored metadata. This does not start a conversion or spend credits.
    Call after the user finishes uploading. Reuse the same uploadSessionId until upload completes or expires.
parameters:
- name: uploadSessionId
  type: string
  required: true
  label:
    en_US: Upload session ID
  human_description:
    en_US: Upload session ID for Check completed browser upload. Reuse the exact opaque ID from the immediately
      preceding KontoCSV result; never guess or fabricate one.
  llm_description: Upload session ID for Check completed browser upload. Reuse the exact opaque ID from the immediately
    preceding KontoCSV result; never guess or fabricate one.
  form: llm
extra:
  python:
    source: tools/complete_browser_upload.py
