identity:
  author: world-discovery-llp
  name: edictiq
  description:
    en_US: Official-source regulatory change intelligence and workspace impact workflows.
  icon: icon.png
  label:
    en_US: Edict IQ
  tags:
  - business
credentials_for_provider: {}
oauth_schema:
  client_schema:
  - name: client_id
    type: text-input
    required: true
    label:
      en_US: Edict IQ OAuth client ID
    help:
      en_US: Register an OAuth client for the displayed Dify plugin callback with Edict IQ.
    url: https://edictiq.com/en/security
  - name: client_secret
    type: secret-input
    required: true
    label:
      en_US: Edict IQ OAuth client secret
  credentials_schema:
  - name: access_token
    type: secret-input
    label:
      en_US: Access Token
  - name: refresh_token
    type: secret-input
    label:
      en_US: Refresh Token
tools:
- tools/list_connected_workspaces.yaml
- tools/search_regulatory_changes.yaml
- tools/get_regulatory_change.yaml
- tools/get_regulatory_evidence.yaml
- tools/list_workspace_monitors.yaml
- tools/list_workspace_impacts.yaml
- tools/get_workspace_impact.yaml
- tools/list_workspace_open_work.yaml
- tools/create_target_monitor.yaml
- tools/prepare_upload_handoff.yaml
- tools/get_workspace_inventory.yaml
- tools/list_document_checks.yaml
extra:
  python:
    source: provider/edictiq.py
