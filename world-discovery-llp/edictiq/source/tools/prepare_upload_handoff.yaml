identity:
  name: prepare_upload_handoff
  author: world-discovery-llp
  label:
    en_US: Get upload link
description:
  human:
    en_US: Returns a link to the selected Edict IQ workspace upload page for a document check, portfolio import, or legal
      entity import. This tool does not upload, import, analyze, or modify files. The user opens the link and selects
      files directly in Edict IQ. Attachments, file contents, public file URLs, access tokens, and upload credentials
      are not accepted by this tool. Imports require user review. Document analysis costs 1 credit per page only after
      explicit confirmation in Edict IQ.
  llm: Returns a link to the selected Edict IQ workspace upload page for a document check, portfolio import, or legal
    entity import. This tool does not upload, import, analyze, or modify files. The user opens the link and selects files
    directly in Edict IQ. Attachments, file contents, public file URLs, access tokens, and upload credentials are not
    accepted by this tool. Imports require user review. Document analysis costs 1 credit per page only after explicit
    confirmation in Edict IQ.
parameters:
- name: organization_id
  type: string
  required: true
  label:
    en_US: Organization id
  human_description:
    en_US: Explicit organization id from list_connected_workspaces; never guess.
  llm_description: Explicit organization id from list_connected_workspaces; never guess.
  form: llm
- name: workspace_id
  type: string
  required: true
  label:
    en_US: Workspace id
  human_description:
    en_US: Explicit workspace id from list_connected_workspaces; never guess.
  llm_description: Explicit workspace id from list_connected_workspaces; never guess.
  form: llm
- name: upload_kind
  type: select
  required: true
  label:
    en_US: Upload kind
  human_description:
    en_US: Upload kind for Get upload link.
  llm_description: Upload kind for Get upload link.
  form: llm
  options:
  - value: document
    label:
      en_US: document
  - value: portfolio
    label:
      en_US: portfolio
  - value: entities
    label:
      en_US: entities
extra:
  python:
    source: tools/prepare_upload_handoff.py
