identity:
  name: list_document_checks
  author: world-discovery-llp
  label:
    en_US: Check the status of your Edict IQ document analyses
description:
  human:
    en_US: List at most ten document-check jobs started by the connected user in the selected Edict IQ workspace. This
      tool does not read document content, file paths or model results; it reports completion and credited page cost
      only. Requires separate analysis.read OAuth permission.
  llm: List at most ten document-check jobs started by the connected user in the selected Edict IQ workspace. This tool
    does not read document content, file paths or model results; it reports completion and credited page cost only. Requires
    separate analysis.read OAuth permission.
parameters:
- name: organization_id
  type: string
  required: true
  label:
    en_US: Organization id
  human_description:
    en_US: Explicit organization id from list_connected_workspaces; never guess.
  llm_description: Explicit organization id from list_connected_workspaces; never guess.
  form: llm
- name: workspace_id
  type: string
  required: true
  label:
    en_US: Workspace id
  human_description:
    en_US: Explicit workspace id from list_connected_workspaces; never guess.
  llm_description: Explicit workspace id from list_connected_workspaces; never guess.
  form: llm
- name: limit
  type: number
  required: false
  label:
    en_US: Limit
  human_description:
    en_US: Limit for Check the status of your Edict IQ document analyses.
  llm_description: Limit for Check the status of your Edict IQ document analyses.
  form: llm
  min: 1
  max: 10
extra:
  python:
    source: tools/list_document_checks.py
