identity:
  name: create_target_monitor
  author: world-discovery-llp
  label:
    en_US: Create target monitor in Edict IQ
description:
  human:
    en_US: Creates one monitored target in an explicitly selected Edict IQ workspace on explicit user request. This state-changing
      operation requires monitor.write consent and a stable idempotency_key UUID. Plan limits and audit records apply.
      No analysis credits are consumed.
  llm: Creates one monitored target in an explicitly selected Edict IQ workspace on explicit user request. This state-changing
    operation requires monitor.write consent and a stable idempotency_key UUID. Plan limits and audit records apply.
    No analysis credits are consumed. Requires explicit user instruction and confirmation; creates a persistent monitor.
parameters:
- name: organization_id
  type: string
  required: true
  label:
    en_US: Organization id
  human_description:
    en_US: Explicit organization id from list_connected_workspaces; never guess.
  llm_description: Explicit organization id from list_connected_workspaces; never guess.
  form: llm
- name: workspace_id
