identity:
  name: search_knowledge
  author: clickhouse
  label:
    en_US: Search knowledge
description:
  human:
    en_US: Search documents shared by this Loom namespace.
  llm: Search documents shared by this Loom namespace.
parameters:
  - name: user_id
    type: string
    required: true
    label:
      en_US: User ID
    human_description:
      en_US: Bind to the end-user identifier from your app. Do not let the model choose
        it.
    form: form
  - name: query
    type: string
    required: true
    label:
      en_US: Query
    human_description:
      en_US: The text to search for.
    llm_description: The text to search for.
    form: llm
  - name: top_k
    type: number
    required: false
    default: 5
    min: 1
    max: 100
    label:
      en_US: Result limit
    human_description:
      en_US: Number of results, from 1 to 100.
    form: form
extra:
  python:
    source: tools/search_knowledge.py
