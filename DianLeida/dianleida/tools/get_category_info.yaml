identity:
  name: "get_category_info"
  author: "DianLeida"
  label:
    en_US: "Category Tree"
    zh_Hans: "类目树查询"
description:
  human:
    en_US: "Browse the 1688 category tree level by level. Pass 0 to list all top-level categories. Each call consumes 1 credit."
    zh_Hans: "按类目 ID 逐级查询子类目；传 0 返回全部一级类目。每次调用消耗 1 点。"
  llm: "Return child categories of a category ID and whether each has children. Pass categoryId=0 for all top-level categories. Use the returned IDs in category filters. Each call consumes 1 credit."
parameters:
  - name: "categoryId"
    type: "string"
    required: true
    form: "llm"
    label:
      en_US: "Category ID"
      zh_Hans: "类目ID"
    human_description:
      en_US: "Category ID"
      zh_Hans: "类目ID"
    llm_description: "Category ID. Use 0 for the top level."
    default: "0"
    placeholder:
      en_US: "0"
      zh_Hans: "0"
extra:
  python:
    source: "tools/get_category_info.py"
