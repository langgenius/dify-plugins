identity:
  name: "shop_rank_list"
  author: "DianLeida"
  label:
    en_US: "Shop Rankings"
    zh_Hans: "店铺排行榜"
description:
  human:
    en_US: "Query five 1688 shop rankings with rank, score, fulfillment rate, response rate and trade medals. Each call consumes 1 credit."
    zh_Hans: "查询五类 1688 店铺榜单，返回排名、综合得分、履约率、响应率、交易勋章等经营指标。每次调用消耗 1 点。"
  llm: "Query 1688 shop rankings. rankType is required: comprehensive, service, popularity, cross_border or new_shop. Returns rank score, rank, fulfillment rate, response rate and trade medals. Each call consumes 1 credit."
parameters:
  - name: "rankType"
    type: "select"
    required: true
    form: "llm"
    label:
      en_US: "Ranking type"
      zh_Hans: "榜单类型"
    human_description:
      en_US: "Ranking type"
      zh_Hans: "榜单类型"
    llm_description: "comprehensive, service, popularity, cross_border or new_shop."
    options:
      - value: "comprehensive"
        label:
          en_US: "Overall strength"
          zh_Hans: "综合实力榜"
      - value: "service"
        label:
          en_US: "Service fulfillment"
          zh_Hans: "服务履约榜"
      - value: "popularity"
        label:
          en_US: "Shop popularity"
          zh_Hans: "店铺热度榜"
      - value: "cross_border"
        label:
          en_US: "Cross-border shops"
          zh_Hans: "跨境店铺榜"
      - value: "new_shop"
        label:
          en_US: "New shops"
          zh_Hans: "新秀店铺榜"
    default: "comprehensive"
  - name: "keyword"
    type: "string"
    required: false
    form: "llm"
    label:
      en_US: "Keyword"
      zh_Hans: "关键词"
    human_description:
      en_US: "Keyword"
      zh_Hans: "关键词"
    llm_description: "Matches product titles of the shop, several values separated by comma, max 20."
  - name: "keywordType"
    type: "select"
    required: false
    form: "llm"
    label:
      en_US: "Keyword target"
      zh_Hans: "关键词对象"
    human_description:
      en_US: "Keyword target"
      zh_Hans: "关键词对象"
    llm_description: "offer for product title, shop for shop name."
    options:
      - value: "offer"
        label:
          en_US: "By product title"
          zh_Hans: "按商品名称"
      - value: "shop"
        label:
          en_US: "By shop name"
          zh_Hans: "按店铺名称"
    default: "offer"
  - name: "shopKeyword"
    type: "string"
    required: false
    form: "llm"
    label:
      en_US: "Shop name"
      zh_Hans: "店铺名称"
    human_description:
      en_US: "Shop name"
      zh_Hans: "店铺名称"
    llm_description: "Shop name filter, several values separated by comma."
  - name: "tradeMedalList"
    type: "string"
    required: false
    form: "llm"
    label:
      en_US: "Trade medals"
      zh_Hans: "交易勋章"
    human_description:
      en_US: "Trade medals"
      zh_Hans: "交易勋章"
    llm_description: "Comma separated medal levels 1-5, for example 4,5."
    placeholder:
      en_US: "4,5"
      zh_Hans: "4,5"
  - name: "memberTypeList"
    type: "string"
    required: false
    form: "llm"
    label:
      en_US: "Member types"
      zh_Hans: "会员类型"
    human_description:
      en_US: "Member types"
      zh_Hans: "会员类型"
    llm_description: "Comma separated: superFactory / Power / TrustPass."
    placeholder:
      en_US: "superFactory,Power"
      zh_Hans: "superFactory,Power"
  - name: "beginTpYear"
    type: "number"
    required: false
    form: "llm"
    label:
      en_US: "TrustPass years min"
      zh_Hans: "诚信通年限下限"
    human_description:
      en_US: "TrustPass years min"
      zh_Hans: "诚信通年限下限"
    llm_description: "Minimum TrustPass membership years."
  - name: "endTpYear"
    type: "number"
    required: false
    form: "llm"
    label:
      en_US: "TrustPass years max"
      zh_Hans: "诚信通年限上限"
    human_description:
      en_US: "TrustPass years max"
      zh_Hans: "诚信通年限上限"
    llm_description: "Maximum TrustPass membership years."
  - name: "pageIndex"
    type: "number"
    required: false
    form: "llm"
    label:
      en_US: "Page index"
      zh_Hans: "页码"
    human_description:
      en_US: "Page index"
      zh_Hans: "页码"
    llm_description: "Starts from 1."
    default: 1
  - name: "pageSize"
    type: "number"
    required: false
    form: "llm"
    label:
      en_US: "Page size"
      zh_Hans: "每页条数"
    human_description:
      en_US: "Page size"
      zh_Hans: "每页条数"
    llm_description: "Max 100."
    default: 100
  - name: "advanced_filters"
    type: "string"
    required: false
    form: "llm"
    label:
      en_US: "Advanced filters (JSON)"
      zh_Hans: "高级筛选（JSON）"
    human_description:
      en_US: "Optional JSON object merged into the request, for filters not listed above."
      zh_Hans: "可选 JSON 对象，直接并入请求体，用于补充上方未列出的筛选参数。"
    llm_description: "Optional JSON object merged into the request body for advanced filters not exposed as dedicated parameters, for example {\"beginSaleCount\": 500}. Leave empty to use only the parameters above."
    placeholder:
      en_US: "{\"beginSaleCount\": 500}"
      zh_Hans: "{\"beginSaleCount\": 500}"
extra:
  python:
    source: "tools/shop_rank_list.py"
