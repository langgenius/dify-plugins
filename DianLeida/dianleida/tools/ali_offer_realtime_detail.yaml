identity:
  name: "ali_offer_realtime_detail"
  author: "DianLeida"
  label:
    en_US: "Product Attributes & Certificates"
    zh_Hans: "商品属性与资质"
description:
  human:
    en_US: "Get product attributes (brand, spec, material, model) and qualification certificates (number, name, issuer, images). Each call consumes 1 credit."
    zh_Hans: "查询商品属性（品牌/规格/材质/型号）与资质证书（编号/名称/签发机构/图片）。每次调用消耗 1 点。"
  llm: "Return product attributes and qualification certificates for one 1688 product. Use for compliance checks and competitor attribute comparison. Show every returned attribute and certificate. Each call consumes 1 credit."
parameters:
  - name: "offerId"
    type: "string"
    required: true
    form: "llm"
    label:
      en_US: "Offer ID"
      zh_Hans: "商品ID"
    human_description:
      en_US: "Offer ID"
      zh_Hans: "商品ID"
    llm_description: "1688 product ID."
    placeholder:
      en_US: "621616092695"
      zh_Hans: "621616092695"
  - name: "advanced_filters"
    type: "string"
    required: false
    form: "llm"
    label:
      en_US: "Advanced filters (JSON)"
      zh_Hans: "高级筛选（JSON）"
    human_description:
      en_US: "Optional JSON object merged into the request, for filters not listed above."
      zh_Hans: "可选 JSON 对象，直接并入请求体，用于补充上方未列出的筛选参数。"
    llm_description: "Optional JSON object merged into the request body for advanced filters not exposed as dedicated parameters, for example {\"beginSaleCount\": 500}. Leave empty to use only the parameters above."
    placeholder:
      en_US: "{\"beginSaleCount\": 500}"
      zh_Hans: "{\"beginSaleCount\": 500}"
extra:
  python:
    source: "tools/ali_offer_realtime_detail.py"
