identity:
  name: "monitor_offer_list"
  author: "DianLeida"
  label:
    en_US: "Monitored Products"
    zh_Hans: "监控商品列表"
description:
  human:
    en_US: "List the products on your watchlist with daily, 7-day and 30-day sales data. Null values mean the data is still being collected. Each call consumes 1 credit."
    zh_Hans: "查看已加入监控的商品及其当日/7 天/30 天销量数据，空值表示数据待更新。每次调用消耗 1 点。"
  llm: "List monitored products with daily, 7-day and 30-day sales figures. Null fields mean data is still being collected, so label them as pending instead of zero. Each call consumes 1 credit."
parameters:
  - name: "pageIndex"
    type: "number"
    required: false
    form: "llm"
    label:
      en_US: "Page index"
      zh_Hans: "页码"
    human_description:
      en_US: "Page index"
      zh_Hans: "页码"
    llm_description: "Starts from 1."
    default: 1
  - name: "pageSize"
    type: "number"
    required: false
    form: "llm"
    label:
      en_US: "Page size"
      zh_Hans: "每页条数"
    human_description:
      en_US: "Page size"
      zh_Hans: "每页条数"
    llm_description: "Max 100."
    default: 20
extra:
  python:
    source: "tools/monitor_offer_list.py"
