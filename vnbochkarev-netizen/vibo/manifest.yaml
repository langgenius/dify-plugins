version: 0.0.1
type: plugin
author: vnbochkarev-netizen
name: vibo
label:
  en_US: ViBo Memory
  zh_Hans: ViBo 记忆
description:
  en_US: >-
    Persistent encrypted memory (L1/L2/L3) for Dify agents. Save facts,
    search memory across sessions (97.5% fewer tokens), thread memory,
    web-search savings. Secrets never reach the LLM.
  zh_Hans: >-
    为 Dify 代理提供持久化加密记忆（L1/L2/L3）。保存事实、跨会话搜索记忆（节省 97.5% 的 token）、
    会话记忆、网页搜索节省。秘密永远不会到达 LLM。
created_at: "2026-08-14T00:00:00Z"
icon: icon.png
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
    model:
      enabled: false
plugins:
  tools:
    - provider/vibo.yaml
privacy: PRIVACY.md
tags:
  - memory
  - agents
  - productivity
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: "0.5.0"
