identity:
  name: thread_memory
  author: vnbochkarev-netizen
  label:
    en_US: Conversation memory
    zh_Hans: 会话记忆
description:
  human:
    en_US: >-
      Store or retrieve conversation context. Compress long conversations
      (-72% tokens) while keeping details restorable.
    zh_Hans: >-
      存储或检索对话上下文。压缩长对话（-72% token），同时保持细节可恢复。
  llm: >-
    Persist conversation context across sessions or compress long
    conversations. Use for chat history that must survive session restart.
extra:
  python:
    source: tools/thread_memory.py
parameters:
  - name: action
    type: select
    required: true
    form: llm
    label:
      en_US: Action
      zh_Hans: 操作
    options:
      - value: add
        label:
          en_US: Add message
          zh_Hans: 添加消息
      - value: context
        label:
          en_US: Get context
          zh_Hans: 获取上下文
    default: add
  - name: text
    type: string
    required: true
    form: llm
    label:
      en_US: Message
      zh_Hans: 消息
    human_description:
      en_US: Message text or context question.
      zh_Hans: 消息文本或上下文问题。
    llm_description: Message to store, or question when action=context.
  - name: role
    type: select
    required: false
    form: form
    label:
      en_US: Role
      zh_Hans: 角色
    options:
      - value: user
        label: user
      - value: assistant
        label: assistant
    default: user
