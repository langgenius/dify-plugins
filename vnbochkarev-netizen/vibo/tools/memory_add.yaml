identity:
  name: memory_add
  author: vnbochkarev-netizen
  label:
    en_US: Save to memory
    zh_Hans: 保存到记忆
description:
  human:
    en_US: >-
      Save a fact to persistent memory (encrypted, L1/L2/L3). The agent will
      recall it in future sessions.
    zh_Hans: >-
      将事实保存到持久化记忆（加密，L1/L2/L3）。代理将在未来的会话中回忆它。
  llm: >-
    Save an important fact about the user, a decision, or a project to
    persistent memory. Use AFTER learning something worth remembering.
extra:
  python:
    source: tools/memory_add.py
parameters:
  - name: label
    type: string
    required: true
    form: llm
    label:
      en_US: Label
      zh_Hans: 标签
    human_description:
      en_US: Short label (e.g. "Anna prefers espresso").
      zh_Hans: 短标签（例如 "Anna prefers espresso"）。
    llm_description: Short label for the fact (max 60 chars).
  - name: content
    type: string
    required: true
    form: llm
    label:
      en_US: Content
      zh_Hans: 内容
    human_description:
      en_US: The fact itself.
      zh_Hans: 事实本身。
    llm_description: The fact to remember.
  - name: level
    type: select
    required: false
    form: form
    label:
      en_US: Level
      zh_Hans: 级别
    options:
      - value: L1
        label:
          en_US: L1 public
          zh_Hans: L1 公开
      - value: L2
        label:
          en_US: L2 private
          zh_Hans: L2 私有
      - value: L3
        label:
          en_US: L3 secret (never reaches LLM)
          zh_Hans: L3 秘密（永不到达 LLM）
    default: L1
