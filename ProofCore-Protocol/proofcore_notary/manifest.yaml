version: 0.0.2
type: tool
author: ProofCore-Protocol
name: proofcore_notary
description:
  en_US: Zero-auth cryptographic notarization and PoE (Proof-of-Existence) on the TON Blockchain.
  zh_Hans: 基于 TON 区块链的零授权密码学存证与溯源引擎。
  ru_RU: Криптографический нотариат и фиксация данных в блокчейне TON.
icon: _assets/icon.png
label:
  en_US: ProofCore Notary
  zh_Hans: ProofCore 存证公证
  ru_RU: ProofCore Нотариат
tools:
  - name: seal_content
    label:
      en_US: Seal Content
    description:
      human:
        en_US: Cryptographically seals text onto the TON Blockchain and returns a verification badge.
      llm: Use this tool to notarize important reports, agreements, or outputs on the blockchain.
    parameters:
      - name: content
        type: string
        required: true
        label:
          en_US: Content
        human_description:
          en_US: The exact text to be sealed.
        llm_description: The full text report or document to notarize.
        form: llm
      - name: agent_id
        type: string
        required: false
        default: Dify Agent
        label:
          en_US: Agent Identifier
        form: llm
  - name: verify_content
    label:
      en_US: Verify Content
    description:
      human:
        en_US: Programmatically verifies a sealed deal against the TON Blockchain.
      llm: Use this tool to verify the authenticity and Ed25519 signature of another agent's output.
    parameters:
      - name: deal_id
        type: string
        required: true
        label:
          en_US: Deal ID
        form: llm
      - name: content
        type: string
        required: true
        label:
          en_US: Content
        form: llm
