identity:
  name: batch_process_images
  author: pixseo
  label:
    en_US: Batch Process Images
    zh_Hans: 批量处理图片
description:
  human:
    en_US: Process multiple product images in batch - supports both URLs and base64. Removes background and compresses to WebP. Alt text should be generated by Dify LLM node. Provide image URLs as comma-separated string, or base64 strings as a JSON array (or newline-separated). Max 10 images, processed in parallel.
    zh_Hans: 批量处理多张商品图片 - 支持URL和Base64两种输入。去背景+WebP压缩。Alt文本由Dify LLM节点生成。图片URL使用逗号分隔；Base64使用JSON数组（或换行分隔）。最多10张，并行处理。
  llm: Use this tool when the user has multiple product images (2-10) that need background removal and WebP compression. Pass image URLs as comma-separated string in image_urls. Pass base64-encoded images as a JSON array in image_base64s (or newline-separated). Each image will be processed in parallel. This tool does NOT generate alt text - use a Dify LLM node for that.
parameters:
  - name: image_urls
    type: string
    required: false
    label:
      en_US: Image URLs
      zh_Hans: 图片URL列表
    human_description:
      en_US: Comma-separated public image URLs (max 10 total with image_base64s)
      zh_Hans: 逗号分隔的图片公开URL（与image_base64s合计最多10张）
    llm_description: "Comma-separated list of public image URLs to process. Maximum 10 images total (combined with image_base64s). Example: 'https://example.com/img1.jpg,https://example.com/img2.jpg'"
    form: llm
  - name: image_base64s
    type: string
    required: false
    label:
      en_US: Image Base64s
      zh_Hans: 图片Base64列表
    human_description:
      en_US: JSON array of base64 encoded image strings, or newline-separated (max 10 total with image_urls)
      zh_Hans: Base64编码图片的JSON数组，或换行分隔（与image_urls合计最多10张）
    llm_description: "JSON array of base64 encoded images, or newline-separated. Maximum 10 images total (combined with image_urls). Use this when the user directly uploads multiple files."
    form: llm
  - name: remove_bg
    type: boolean
    required: false
    default: true
    label:
      en_US: Remove Background
      zh_Hans: 去除背景
    human_description:
      en_US: "Whether to remove image backgrounds (default: true)"
      zh_Hans: 是否去除图片背景（默认：是）
    llm_description: Whether to remove backgrounds from all images. Default is true.
    form: llm
  - name: compress
    type: boolean
    required: false
    default: true
    label:
      en_US: Compress to WebP
      zh_Hans: 压缩为WebP
    human_description:
      en_US: "Whether to compress images to WebP format (default: true)"
      zh_Hans: 是否压缩为WebP格式（默认：是）
    llm_description: Whether to compress all images to WebP format. Default is true.
    form: llm
  - name: privacy_accepted
    type: boolean
    required: true
    default: false
    label:
      en_US: Privacy Accepted
      zh_Hans: 已阅读隐私声明
    human_description:
      en_US: "Must be set to true to use the API. Read privacy notice at GET /api/v1/privacy."
      zh_Hans: 必须设为true才能调用API。隐私声明见 GET /api/v1/privacy。
    llm_description: Must be set to true to use the API. Ask the user to confirm they have read the privacy notice before setting this to true. The external API only handles background removal and WebP compression - alt text, schema, and listing are generated locally by the LLM.
    form: llm
extra:
  python:
    source: tools/batch_process_images.py