identity:
  name: process_image
  author: pixseo
  label:
    en_US: Process Product Image
    zh_Hans: 商品图片处理
description:
  human:
    en_US: Process a product image - removes background and compresses to WebP. Alt text, Schema, and Listing are generated by the Agent's local LLM, not by this API. Provide either image_base64 or file_url.
    zh_Hans: 处理商品图片 - AI去背景、WebP压缩。Alt文本、Schema和Listing由Agent本地LLM生成，不经过此API。需提供图片Base64或URL。
  llm: Use this tool when the user uploads a product image and needs background removal and WebP compression. It removes the background and compresses the image to WebP format. This tool does NOT generate alt text, schema, or listing - those should be generated by the LLM node in the workflow. Pass either image_base64 or file_url (one is required).
parameters:
  - name: image_base64
    type: string
    required: false
    label:
      en_US: Image Base64
      zh_Hans: 图片Base64
    human_description:
      en_US: Base64 encoded image data (JPEG/PNG/WebP)
      zh_Hans: Base64编码的图片数据（JPEG/PNG/WebP）
    llm_description: Base64 encoded product image. Use this when the user directly uploads an image file. One of image_base64 or file_url is required.
    form: llm
  - name: file_url
    type: string
    required: false
    label:
      en_US: Image URL
      zh_Hans: 图片URL
    human_description:
      en_US: Public URL of the product image
      zh_Hans: 商品图片的公开URL地址
    llm_description: Public accessible URL of the product image. Use this when the user provides an image link. One of image_base64 or file_url is required.
    form: llm
  - name: remove_bg
    type: boolean
    required: false
    default: true
    label:
      en_US: Remove Background
      zh_Hans: 去除背景
    human_description:
      en_US: "Whether to remove the image background (default: true)"
      zh_Hans: 是否去除图片背景（默认：是）
    llm_description: Whether to remove the background from the product image. Default is true.
    form: llm
  - name: compress
    type: boolean
    required: false
    default: true
    label:
      en_US: Compress to WebP
      zh_Hans: 压缩为WebP
    human_description:
      en_US: "Whether to compress the image to WebP format (default: true)"
      zh_Hans: 是否压缩为WebP格式（默认：是）
    llm_description: Whether to compress the image to WebP format. Default is true.
    form: llm
  - name: privacy_accepted
    type: boolean
    required: true
    default: false
    label:
      en_US: Privacy Accepted
      zh_Hans: 已阅读隐私声明
    human_description:
      en_US: "Must be set to true to use the API. Read privacy notice at GET /api/v1/privacy."
      zh_Hans: 必须设为true才能调用API。隐私声明见 GET /api/v1/privacy。
    llm_description: Must be set to true to use the API. Ask the user to confirm they have read the privacy notice before setting this to true. The external API only handles background removal and WebP compression - alt text, schema, and listing are generated locally by the LLM.
    form: llm
extra:
  python:
    source: tools/process_image.py