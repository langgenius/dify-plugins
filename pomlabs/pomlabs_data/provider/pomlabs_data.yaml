identity:
  author: pomlabs
  name: pomlabs_data
  label:
    en_US: Pom Labs Data
  description:
    en_US: "Public social and web data as clean JSON: YouTube comments and transcripts, Instagram, LinkedIn, Reddit, Threads, Google Ads. One API key, no login to the source sites."
  icon: icon.png
  tags:
    - social
    - search
    - utilities
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API key
    placeholder:
      en_US: Your Pom Labs X-API-Key
    help:
      en_US: Free key on RapidAPI (free plan on every API)
    url: https://rapidapi.com/user/pomlabs

