version: 0.0.1
type: plugin
author: Souravrajvi0
name: x402_pay_per_call
label:
  en_US: x402 Pay-Per-Call
  zh_Hans: x402 按次付费调用
description:
  en_US: Call third-party HTTP endpoints that use the x402 pay-per-call scheme. Relays the HTTP 402 payment challenge to the caller, and retries with a settled Nano (XNO) payment proof. The plugin never holds a wallet, seed, or private key.
  zh_Hans: 调用采用 x402 按次付费方案的第三方 HTTP 接口。将 HTTP 402 支付挑战信息转发给调用方，并使用已结算的 Nano (XNO) 支付凭证重试。插件本身不持有钱包、助记词或私钥。
created_at: "2026-09-24T00:00:00Z"
icon: icon.svg
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
    model:
      enabled: false
plugins:
  tools:
    - provider/x402_pay_per_call.yaml
privacy: PRIVACY.md
tags:
  - utilities
  - finance
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
