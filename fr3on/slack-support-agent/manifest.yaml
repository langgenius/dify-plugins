version: 0.0.1
type: plugin
author: fr3on
name: slack-support-agent
label:
  en_US: Slack Support Agent
  ja_JP: Slack Support Agent
  zh_Hans: Slack Support Agent
  pt_BR: Slack Support Agent
description:
  en_US: "Connects Slack to a Dify agent for thread replies (optionally posting the first reply to the channel) and direct messages, with mrkdwn formatting, thread/DM conversation history and user list, configurable context scope, and optional usage channel restriction."
  ja_JP: "スレッド返信（初回返信をチャンネルにも投稿可）とダイレクトメッセージに対応したSlack向けDifyエージェント連携プラグイン。mrkdwn対応、スレッド/DM履歴・ユーザーリスト参照、文脈範囲の設定、任意の利用チャンネル制限に対応。"
  zh_Hans: "将 Slack 连接到 Dify 智能体的插件，支持线程回复（可选将首次回复发送至频道）和私信，支持 mrkdwn 格式、线程/私信历史和用户列表、可配置的上下文范围，并可选限制使用频道。"
  pt_BR: "Conecta o Slack a um agente Dify para respostas em thread (opcionalmente postando a primeira resposta no canal) e mensagens diretas, com formatação mrkdwn, histórico de conversa em thread/DM e lista de usuários, escopo de contexto configurável, e restrição opcional de canais de uso."
icon: icon.svg
tags: ['productivity','social']
resource:
  memory: 536870912
  permission:
    tool:
      enabled: true
    model:
      enabled: true
      llm: true
      text_embedding: false
      rerank: false
      tts: false
      speech2text: false
      moderation: false
    endpoint:
      enabled: true
    app:
      enabled: true
    storage:
      enabled: true
      size: 1048576
plugins:
  endpoints:
    - group/slack.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
created_at: 2026-09-09T00:00:00Z
privacy: PRIVACY.md
verified: false
