version: 0.3.3
type: plugin
author: gitpoldan
name: tool_capture_agent
label:
  en_US: Tool-Capture Agent
  ru_RU: Агент с захватом инструментов
description:
  en_US: Function-Calling agent strategy that captures every tool call, wires tool I/O via indexes (not the LLM context), injects Chatflow sys.files as multimodal prompt content, routes Skills & Tools catalogs into a compact system prompt, and exposes tool outputs as structured workflow variables.
  ru_RU: Стратегия агента (Function Calling), которая перехватывает вызовы инструментов, связывает их I/O через индексы (не через контекст LLM), передаёт вложения Chatflow (sys.files) в LLM как multimodal-контент, собирает компактный системный промпт из каталогов Skills & Tools и отдаёт результаты как структурированные переменные воркфлоу.
icon: icon.svg
tags:
  - agent
resource:
  memory: 1048576
  permission:
    tool:
      enabled: true
    model:
      enabled: true
      llm: true
plugins:
  agent_strategies:
    - provider/agent.yaml
meta:
  version: 0.3.3
  minimum_dify_version: "1.16.1"
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
created_at: 2026-07-08T00:00:00+00:00
privacy: PRIVACY.md
verified: false
