version: 1.0.7
type: plugin
author: gitpoldan
name: qdrant_hybrid_retriever
label:
  en_US: Qdrant Hybrid Retriever
  ja_JP: Qdrant Hybrid Retriever
  zh_Hans: Qdrant 混合检索
  pt_BR: Qdrant Hybrid Retriever
  ru_RU: Qdrant Hybrid Retriever
description:
  en_US: Qdrant hybrid retriever built on the official qdrant-client. Dense + BM25 sparse retrieval with DBSF/RRF fusion, optional MMR, tenant automode/ratios, score_threshold, arbitrary payload filters, and optional reranking.
  ja_JP: 公式 qdrant-client 上の Qdrant ハイブリッド検索。Dense + BM25 Sparse と DBSF/RRF 融合、MMR、tenant automode/ratios、score_threshold、任意 payload フィルタ、rerank 対応。
  zh_Hans: 基于官方 qdrant-client 的 Qdrant 混合检索：密集 + BM25 稀疏，DBSF/RRF 融合，可选 MMR、tenant automode/ratios、score_threshold、任意 payload 过滤与 rerank。
  pt_BR: Recuperação híbrida Qdrant sobre o qdrant-client oficial. Denso + BM25 esparso com fusão DBSF/RRF, MMR opcional, automode/ratios de tenants, score_threshold, filtros de payload arbitrários e rerank opcional.
  ru_RU: Гибридный ретривер Qdrant на официальном qdrant-client. Dense + BM25 sparse с fusion DBSF/RRF, опциональным MMR, automode/ratios по tenants, score_threshold, произвольными payload-фильтрами и переранжированием.
icon: icon.svg
icon_dark: icon-dark.svg
resource:
  memory: 536870912
  permission:
    tool:
      enabled: true
    model:
      enabled: true
      text_embedding: true
      rerank: true
plugins:
  tools:
    - provider/qdrant.yaml
meta:
  version: 1.0.7
  minimum_dify_version: "1.14.0"
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
tags:
  - search
  - utilities
