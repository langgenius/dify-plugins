version: 0.0.1
type: plugin
author: gitpoldan
name: task_manager
label:
  en_US: Transit Task Manager
  ru_RU: Транзитный таск-менеджер
description:
  en_US: Multi-tenant transit task manager backed by S3. Stores one SQLite database per tenant, supports full task CRUD, a status state machine with per-transition metadata, and lazy TTL auto-expiration.
  ru_RU: Мультитenantный транзитный таск-менеджер поверх S3. Хранит одну SQLite-БД на тенанта, поддерживает полный CRUD по задачам, конечный автомат статусов с метаданными на переход и ленивое авто-истечение по TTL.
icon: icon.svg
tags:
  - productivity
  - utilities
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
plugins:
  tools:
    - provider/task_manager.yaml
meta:
  version: 0.0.1
  minimum_dify_version: "1.4.0"
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
created_at: 2026-07-13T00:00:00+00:00
privacy: PRIVACY.md
verified: false
