provider: fikra
label:
  en_US: Fikra API
description:
  en_US: DeepSeek, Qwen, Kimi, GLM, Gemini, Seed and MiMo models through one OpenAI-compatible key.
icon_small:
  en_US: icon.png
icon_large:
  en_US: icon.png
background: "#FFF4EF"
help:
  title:
    en_US: Get your API key from Fikra API
  url:
    en_US: https://fikraapi.co.ke/dashboard
supported_model_types:
  - llm
configurate_methods:
  - predefined-model
  - customizable-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Your Fikra API key (fk_live_...)
    - variable: endpoint_url
      label:
        en_US: API Base URL
      type: text-input
      required: false
      placeholder:
        en_US: "Optional. Default: https://api.fikraapi.co.ke/v1"
model_credential_schema:
  model:
    label:
      en_US: Model ID
    placeholder:
      en_US: Any model ID from https://fikraapi.co.ke/models, e.g. qwen3.8-27b
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Your Fikra API key (fk_live_...)
    - variable: context_size
      label:
        en_US: Context size
      type: text-input
      required: true
      default: "131072"
    - variable: max_tokens_to_sample
      label:
        en_US: Max output tokens
      type: text-input
      required: true
      default: "8192"
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
extra:
  python:
    provider_source: provider/fikra.py
    model_sources:
      - models/llm/llm.py
