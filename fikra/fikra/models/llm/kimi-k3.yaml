model: kimi-k3
label:
  en_US: Kimi K3
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1113088
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 1048576
  - name: response_format
    use_template: response_format
pricing:
  input: "2.4375"
  output: "12.1875"
  unit: "0.000001"
  currency: USD
