model: qwen-plus
label:
  en_US: Qwen Plus
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 262144
  - name: response_format
    use_template: response_format
pricing:
  input: "0.5"
  output: "1.5"
  unit: "0.000001"
  currency: USD
