model: gemini-4-argon
label:
  en_US: Gemini 4 Argon
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 65536
  - name: response_format
    use_template: response_format
pricing:
  input: "2.5"
  output: "12.0"
  unit: "0.000001"
  currency: USD
