model: glm-5.3-flash
label:
  en_US: GLM 5.3 Flash
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 327680
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 131072
  - name: response_format
    use_template: response_format
pricing:
  input: "0.1875"
  output: "0.625"
  unit: "0.000001"
  currency: USD
