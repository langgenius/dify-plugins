model: deepseek-v4.1-flash
label:
  en_US: DeepSeek V4.1 Flash
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 393216
  - name: response_format
    use_template: response_format
pricing:
  input: "0.1875"
  output: "0.75"
  unit: "0.000001"
  currency: USD
