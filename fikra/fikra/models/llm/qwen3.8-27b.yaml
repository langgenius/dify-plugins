model: qwen3.8-27b
label:
  en_US: Qwen 3.8 27B
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1001536
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 32768
  - name: response_format
    use_template: response_format
pricing:
  input: "0.045"
  output: "0.35"
  unit: "0.000001"
  currency: USD
