model: fikra-pro-120b
label:
  en_US: fikra-pro-120b
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 131072
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 65536
  - name: response_format
    use_template: response_format
pricing:
  input: "0.3"
  output: "0.3"
  unit: "0.000001"
  currency: USD
