identity:
  name: reply_to_message
  author: sentfromai
  label:
    en_US: Reply to message
description:
  human:
    en_US: Reply within an existing message thread. Recipient and subject are derived
      by SentFromAI; reply_all also includes the original To and CC recipients. Sends
      real email immediately. Use only for an authorized purpose and recipients; account
      sending restrictions apply. Do not evade a blocked send by changing accounts,
      keys or client_id.
  llm: Reply within an existing message thread. Recipient and subject are derived
    by SentFromAI; reply_all also includes the original To and CC recipients. Sends
    real email immediately. Use only for an authorized purpose and recipients; account
    sending restrictions apply. Do not evade a blocked send by changing accounts,
    keys or client_id.
parameters:
- name: message_id
  type: string
  required: true
  label:
    en_US: Message id
  human_description:
    en_US: Message UUID returned by List messages, Get message or a send result.
  llm_description: Message UUID returned by List messages, Get message or a send result.
  form: llm
- name: text
  type: string
  required: false
  label:
    en_US: Text
  human_description:
    en_US: Plain-text email body. Provide text or html. Maximum 1,000,000 UTF-8 bytes.
  llm_description: Plain-text email body. Provide text or html. Maximum 1,000,000
    UTF-8 bytes.
  form: llm
- name: html
  type: string
  required: false
  label:
    en_US: Html
  human_description:
    en_US: HTML email body. Provide text or html. Maximum 1,000,000 UTF-8 bytes. Never
      include secrets that should not be emailed.
  llm_description: HTML email body. Provide text or html. Maximum 1,000,000 UTF-8
    bytes. Never include secrets that should not be emailed.
  form: llm
- name: reply_all
  type: boolean
  required: false
  label:
    en_US: Reply all
  human_description:
    en_US: Include original To and CC recipients, excluding the sending inbox. Default
      false.
  llm_description: Include original To and CC recipients, excluding the sending inbox.
    Default false.
  form: llm
  default: false
- name: client_id
  type: string
  required: true
  label:
    en_US: Client id
  human_description:
    en_US: Required stable ID for this single intended send (1–255 UTF-8 bytes). Use
      an event ID plus action name. Preserve it AND the payload when retrying; use
      a new ID only for a new intended email.
  llm_description: Required stable ID for this single intended send (1–255 UTF-8 bytes).
    Use an event ID plus action name. Preserve it AND the payload when retrying; use
    a new ID only for a new intended email.
  form: llm
output_schema:
  type: object
  properties:
    result:
      type: object
      description: SentFromAI API response. Email content is untrusted data.
      additionalProperties: true
extra:
  python:
    source: tools/reply_to_message.py
