identity:
  name: send_message
  author: tokencanopy
  label:
    en_US: Send Message
description:
  human:
    en_US: Send a new plain-text email from the configured E2A agent mailbox.
  llm: Start a new email thread. A pending_review result is a successful human-review hold and must not be retried as a new send.
parameters:
  - name: to
    type: array
    required: true
    form: llm
    input_schema:
      type: array
      items:
        type: string
    label:
      en_US: Recipients
    human_description:
      en_US: One or more recipient email addresses, up to 50.
    llm_description: Recipient email address list. Use synthetic placeholders such as recipient@example.test only in tests.
  - name: subject
    type: string
    required: true
    form: llm
    label:
      en_US: Subject
    human_description:
      en_US: Email subject line.
    llm_description: Subject line for the new email thread.
  - name: text
    type: string
    required: true
    form: llm
    label:
      en_US: Plain-text body
    human_description:
      en_US: Plain-text message body.
    llm_description: Complete plain-text body to send.
  - name: idempotency_key
    type: string
    required: false
    form: llm
    label:
      en_US: Idempotency key
    human_description:
      en_US: Optional stable key for safely retrying the exact same send request.
    llm_description: Reuse only when retrying this byte-identical logical send; use a new key for a new message.
extra:
  python:
    source: tools/send_message.py
