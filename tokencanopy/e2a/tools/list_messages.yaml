identity:
  name: list_messages
  author: tokencanopy
  label:
    en_US: List Messages
description:
  human:
    en_US: List one bounded page of messages for the configured E2A agent mailbox.
  llm: List up to 50 E2A message summaries. Use next_cursor from the result to request another page.
parameters:
  - name: limit
    type: number
    required: false
    default: 20
    min: 1
    max: 50
    form: form
    label:
      en_US: Maximum results
    human_description:
      en_US: Number of message summaries to return (1-50).
    llm_description: Maximum number of message summaries to return, from 1 to 50.
  - name: direction
    type: select
    required: false
    default: inbound
    form: form
    options:
      - value: inbound
        label:
          en_US: Inbound
      - value: outbound
        label:
          en_US: Outbound
      - value: all
        label:
          en_US: All
    label:
      en_US: Direction
    human_description:
      en_US: Include inbound messages, outbound messages, or both.
    llm_description: Filter by inbound, outbound, or all messages.
  - name: read_status
    type: select
    required: false
    default: auto
    form: form
    options:
      - value: auto
        label:
          en_US: Automatic
      - value: unread
        label:
          en_US: Unread
      - value: read
        label:
          en_US: Read
      - value: all
        label:
          en_US: All
    label:
      en_US: Read status
    human_description:
      en_US: Automatic selects unread for inbound messages and all for outbound or all directions.
    llm_description: Filter by read state. Automatic safely selects unread for inbound and all otherwise.
  - name: cursor
    type: string
    required: false
    form: llm
    label:
      en_US: Cursor
    human_description:
      en_US: Opaque next_cursor from a previous result.
    llm_description: To continue listing, pass next_cursor from the previous list_messages result unchanged.
extra:
  python:
    source: tools/list_messages.py
