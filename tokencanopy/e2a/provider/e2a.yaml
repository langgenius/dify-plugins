identity:
  author: tokencanopy
  name: e2a
  label:
    en_US: E2A Email
  description:
    en_US: Give a Dify agent an authenticated inbox with bounded reads, new sends, and threaded replies.
  icon: icon.svg
  tags:
    - productivity
credentials_for_provider:
  e2a_api_key:
    type: secret-input
    required: true
    label:
      en_US: E2A_API_KEY
    placeholder:
      en_US: Paste an agent-scoped E2A API key
    help:
      en_US: Create a key with scope=agent for the inbox this Dify app should use. Account-scoped keys are rejected.
    url: https://e2a.dev
tools:
  - tools/whoami.yaml
  - tools/list_messages.yaml
  - tools/get_message.yaml
  - tools/send_message.yaml
  - tools/reply_to_message.yaml
extra:
  python:
    source: provider/e2a.py
