name: stage dasha-compute package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write package and remove this workflow
        run: |
          mkdir -p Uuriko/dasha-compute
          echo '' | base64 -d > Uuriko/dasha-compute/dasha-compute-0.0.1.difypkg
          git rm -q .github/workflows/stage-pkg.yml
          git config user.name 'Uuriko'
          git config user.email 'potter@trydemigod.com'
          git add Uuriko/dasha-compute/dasha-compute-0.0.1.difypkg
          git commit -m 'fix: repackage dasha-compute 0.0.1 (manifest repo/contact, dify_plugin>=0.9.0, drop invalid position field)'
          git push
