name: Reconstruct HumanMirror Guard 0.1.3 Control Plane

on:
  push:
    branches:
      - update-humanmirror-guard-0.1.3-control-plane
    paths:
      - 'VibeMirror-coder/humanmirror_guard/.hm013/**'
      - '.github/workflows/humanmirror-013-control-plane.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-humanmirror-guard-0.1.3-control-plane
      - name: Reconstruct and verify package
        run: |
          set -euo pipefail
          dir='VibeMirror-coder/humanmirror_guard'
          cat "$dir"/.hm013/part-* > "$RUNNER_TEMP/hm013.b64"
          base64 -d "$RUNNER_TEMP/hm013.b64" > "$dir/humanmirror_guard-0.1.3.difypkg"
          echo 'e34444bce12271b5cf0d3e6a6015e10b3fb038c922f3056d355cc4f4f60f6627  VibeMirror-coder/humanmirror_guard/humanmirror_guard-0.1.3.difypkg' | sha256sum -c -
          unzip -t "$dir/humanmirror_guard-0.1.3.difypkg"
      - name: Commit verified binary only
        run: |
          set -euo pipefail
          rm -rf VibeMirror-coder/humanmirror_guard/.hm013
          rm -f .github/workflows/humanmirror-013-control-plane.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update HumanMirror Guard to 0.1.3'
          git push origin HEAD:update-humanmirror-guard-0.1.3-control-plane
