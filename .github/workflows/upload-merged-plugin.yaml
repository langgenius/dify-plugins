name: Upload Merged Plugin

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - ".github/**"
      - ".gitignore"
      - "unpacked_plugin/**"
      - "README.md"
      - "LICENSE"

env:
  REPO_NAME: langgenius/dify-plugins
  # The marketplace toolkit is cloned here at run time (see .gitignore).
  TOOLKIT_DIR: .github/scripts/toolkit

jobs:
  # No elevated permissions: the toolkit and the CLI are cloned with
  # ORG_SCOPE_GITHUB_TOKEN, and nothing here writes back to the repository.
  upload-merged-plugin:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Clone Marketplace Toolkit
        env:
          GH_TOKEN: ${{ secrets.ORG_SCOPE_GITHUB_TOKEN }}
        run: gh repo clone langgenius/dify-marketplace-toolkit -- "$TOOLKIT_DIR"

      - name: Download Plugin Daemon
        env:
          GH_TOKEN: ${{ secrets.ORG_SCOPE_GITHUB_TOKEN }}
        run: |
          gh release download -R langgenius/dify-plugin-daemon --pattern "dify-plugin-linux-amd64" --dir "$TOOLKIT_DIR"
          chmod +x "$TOOLKIT_DIR/dify-plugin-linux-amd64"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.7

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ensure jq and yq
        run: |
          jq --version
          if ! command -v yq >/dev/null 2>&1; then
            echo "yq is not preinstalled on this runner; installing it"
            sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.5/yq_linux_amd64" \
              -o /usr/local/bin/yq
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Get Changed Files from Push
        run: |
          # check-pkg-paths.py needs each file's change status, which
          # --name-status provides: added / removed / modified.
          CHANGED_FILES=$(git diff --name-status ${{ github.event.before }} ${{ github.sha }} | jq -R -s -c '
            split("\n")[:-1]
            | map(select(length > 0))
            | map(split("\t"))
            | map({
                path: .[-1],
                status: (
                  .[0]
                  | if startswith("A") then "added"
                    elif startswith("D") then "removed"
                    elif startswith("R") then "added"
                    else "modified"
                    end
                )
              })
          ')
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
          echo "CHANGED_FILES=$CHANGED_FILES"

      - name: Validate Plugin Path
        env:
          PR_FILES: ${{ env.CHANGED_FILES }}
        run: |
          set -o pipefail
          # The script prints the package path last, after any informational
          # lines (e.g. "also removing N older version(s)"), so read the last
          # line. pipefail keeps a rejected push from looking like a success.
          if PLUGIN_PATH=$(python3 "$TOOLKIT_DIR/validator/check-pkg-paths.py" | tail -n 1); then
              echo "PLUGIN_PATH=$PLUGIN_PATH" >> $GITHUB_ENV
          else
              echo "Only one .difypkg file change is allowed in a single push."
              exit 1
          fi

      # Re-validates the merged bytes before publishing: one entry point, the
      # same registry of package checks the pull request ran. A blocking
      # finding exits non-zero, which fails this job before anything uploads.
      - name: Final Package Validation
        run: |
          python3 "$TOOLKIT_DIR/validator/validate-difypkg.py" "$PLUGIN_PATH" \
            --output-dir /tmp/validation

      - name: Publish validation summary
        if: always()
        run: |
          if [ -f /tmp/validation/summary.md ]; then
            cat /tmp/validation/summary.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

      - name: Extract Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_SHA=$(git log -1 --format=%H -- "$PLUGIN_PATH")
          PR_NUMBER=$(gh api "repos/${{ env.REPO_NAME }}/commits/$LAST_SHA/pulls" --jq '.[0].number // empty' || true)
          if [ -n "$PR_NUMBER" ]; then
            gh pr view "$PR_NUMBER" -R "${{ env.REPO_NAME }}" --json body --jq .body > /tmp/pr_body.md
            # A maintainer-applied label is the only way to let a version move
            # the plugin to another category; the Marketplace refuses it otherwise.
            if gh pr view "$PR_NUMBER" -R "${{ env.REPO_NAME }}" --json labels --jq '.labels[].name' | grep -qx 'allow-category-change'; then
              echo "PR #$PR_NUMBER is labelled allow-category-change"
              echo "CATEGORY_FLAG=--allow-category-change" >> "$GITHUB_ENV"
            fi
          else
            echo "No associated PR found for $LAST_SHA; uploading without release notes."
            : > /tmp/pr_body.md
          fi
          python3 "$TOOLKIT_DIR/tools/extract-changelog.py" --pr-body-file /tmp/pr_body.md > /tmp/changelog.md
          echo "--- extracted release notes ---"
          cat /tmp/changelog.md

      # One upload call publishes to production and, when the staging secrets
      # are set, fans out to staging as a mirror. A mirror never fails the
      # publish: the uploader downgrades a mirror failure to a warning, so a
      # red staging environment can no longer block a release.
      - name: Upload Plugin
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          MARKETPLACE_BASE_URL: ${{ secrets.MARKETPLACE_BASE_URL }}
          STAGING_BASE_URL: ${{ secrets.MARKETPLACE_STAGING_BASE_URL }}
          STAGING_TOKEN: ${{ secrets.MARKETPLACE_STAGING_TOKEN }}
        run: |
          MIRROR_ARGS=()
          if [ -n "$STAGING_BASE_URL" ] && [ -n "$STAGING_TOKEN" ]; then
            MIRROR_ARGS=(--mirror-url "$STAGING_BASE_URL" --mirror-token "$STAGING_TOKEN")
          else
            echo "MARKETPLACE_STAGING_BASE_URL / _TOKEN are not set; skipping the staging mirror"
          fi

          python3 "$TOOLKIT_DIR/uploader" -p "$PLUGIN_PATH" -t "$MARKETPLACE_TOKEN" \
            --plugin-daemon-path "$TOOLKIT_DIR/dify-plugin-linux-amd64" \
            -u "$MARKETPLACE_BASE_URL" \
            --with-changelog ${CATEGORY_FLAG:+"$CATEGORY_FLAG"} "${MIRROR_ARGS[@]}" \
            < /tmp/changelog.md
