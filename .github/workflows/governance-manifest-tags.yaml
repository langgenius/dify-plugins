name: Governance - Manifest Tags

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - dev
    paths:
      - "**/*.difypkg"
      - "**/manifest.yaml"

concurrency:
  group: governance-manifest-tags-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  manifest-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml \
            || echo "PyYAML unavailable; the check falls back to its built-in manifest parser."

      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          mkdir -p /tmp/governance
          gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | [.filename, .status] | @tsv' > /tmp/governance/changed_files.tsv
          python3 - <<'PY'
          import json
          import os

          rows = [
              line.rstrip("\n").split("\t")
              for line in open("/tmp/governance/changed_files.tsv", encoding="utf-8")
              if line.strip()
          ]
          files = [{"filename": row[0], "status": row[1]} for row in rows]
          expected = int(os.environ.get("EXPECTED_CHANGED_FILES") or 0)
          # The files API returns at most 3,000 entries. Never skip the check on an incomplete list.
          if expected and len(files) < expected:
              raise SystemExit(
                  f"Cannot determine changed files: PR file list is incomplete "
                  f"({len(files)} of {expected}). Re-run the check."
              )
          with open("/tmp/governance/changed_files.json", "w", encoding="utf-8") as handle:
              json.dump(files, handle)
          print(f"Collected {len(files)} changed file(s).")
          PY

      - name: Check manifest tags
        run: |
          python3 .github/scripts/governance/check_manifest_tags.py \
            --changed-files /tmp/governance/changed_files.json \
            --repo-root .
