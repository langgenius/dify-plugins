name: Add Dasha Compute plugin package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add package
        env:
          PACKAGE_B64: 
        run: |
          mkdir -p Uuriko/dasha-compute
          printf '%s' "$PACKAGE_B64" | base64 -d > Uuriko/dasha-compute/dasha-compute-0.0.1.difypkg
          git config user.name Uuriko
          git config user.email potter@trydemigod.com
          git add Uuriko/dasha-compute/dasha-compute-0.0.1.difypkg
          git commit -m 'feat: add Dasha Compute provider'
          git push
