identity:
  name: rewrite_prompt
  author: promptefficiently
  label:
    en_US: Prompt Efficiently rewrite
description:
  human:
    en_US: Rewrites a prompt so it asks for the same thing in fewer words, aiming to cost fewer credits, tokens or messages. Only the rewritten prompt is returned; review it against your original before using it. The text is sent to Prompt Efficiently's servers and its AI provider, only when you turned on the 18+ consent in the plugin settings. Free accounts get 5 rewrites; Pro gets more.
  llm: "Rewrite a prompt shorter while keeping its goal, to save credits, tokens or messages on any AI product. Modes: shorter (default), clearer, more_specific. Returns only the rewrite with a review warning. Requires the account's 18+ consent setting. Suggest running estimate_prompt before and after to show the saving."
parameters:
  - name: text
    type: string
    required: true
    label:
      en_US: Prompt to rewrite
    human_description:
      en_US: The prompt you want shortened. It is sent to Prompt Efficiently and its AI provider to produce the rewrite.
    llm_description: The full prompt text to rewrite.
    form: llm
  - name: mode
    type: select
    required: false
    default: shorter
    label:
      en_US: Mode
    human_description:
      en_US: Shorter cuts words. Clearer tidies wording. More specific pins down vague asks.
    llm_description: Rewrite mode. shorter = fewest words for the same goal (default). clearer = easier to follow. more_specific = pins down vague asks.
    form: llm
    options:
      - value: shorter
        label: {en_US: Shorter}
      - value: clearer
        label: {en_US: Clearer}
      - value: more_specific
        label: {en_US: More specific}
extra:
  python:
    source: tools/rewrite_prompt.py
