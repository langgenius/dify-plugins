provider: bumo_router
label:
  en_US: Bumo Router
  zh_Hans: 不墨 Router
description:
  en_US: One API key for DeepSeek, Kimi, Qwen, GLM, MiniMax, Claude, GPT, Gemini and more.
  zh_Hans: 一个 Key 用上 DeepSeek、Kimi、通义千问、GLM、MiniMax，以及 Claude、GPT、Gemini 等模型。
icon_small:
  en_US: icon.png
icon_large:
  en_US: icon.png
background: "#F5F5F7"
help:
  title:
    en_US: Get your API key from Bumo Router
    zh_Hans: 从不墨 Router 获取 API Key
  url:
    en_US: https://router.bumo.ai/user/api-keys
    zh_Hans: https://router.bumo.cc/user/api-keys
supported_model_types:
  - llm
configurate_methods:
  - predefined-model
  - customizable-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Paste your Bumo Router API key (China and international keys both work)
        zh_Hans: 粘贴不墨 Router 的 API Key（国内站、国际站的 Key 都可以）
    - variable: endpoint_url
      label:
        en_US: Custom API base URL (optional)
        zh_Hans: 自定义 API 地址（可选）
      type: text-input
      required: false
      placeholder:
        en_US: Leave empty to detect automatically
        zh_Hans: 留空即可，会按 Key 自动识别国内站 / 国际站
model_credential_schema:
  model:
    label:
      en_US: Model name
      zh_Hans: 模型名称
    placeholder:
      en_US: e.g. deepseek/deepseek-flash — context length and tool support are filled in automatically
      zh_Hans: 例如 deepseek/deepseek-flash，上下文长度、工具调用等能力自动识别
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Paste your Bumo Router API key
        zh_Hans: 粘贴不墨 Router 的 API Key
    - variable: endpoint_url
      label:
        en_US: Custom API base URL (optional)
        zh_Hans: 自定义 API 地址（可选）
      type: text-input
      required: false
      placeholder:
        en_US: Leave empty to detect automatically
        zh_Hans: 留空即可，会按 Key 自动识别
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
extra:
  python:
    provider_source: provider/bumo_router.py
    model_sources:
      - models/llm/llm.py
