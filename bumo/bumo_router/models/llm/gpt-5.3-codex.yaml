  use_template: presence_penalty
  help:
    zh_Hans: 该模型不支持此参数，开启了也不生效，不影响正常调用
    en_US: Not supported by this model. Ignored if set; calls still work.
- name: frequency_penalty
  use_template: frequency_penalty
