model: gpt-5.3-codex
label:
  en_US: GPT-5.3 Codex
model_type: llm
features:
- agent-thought
- tool-call
- multi-tool-call
- stream-tool-call
- vision
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
