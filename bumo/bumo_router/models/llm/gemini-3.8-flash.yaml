model: gemini-3.8-flash
label:
  en_US: Gemini 3.8 Flash
model_type: llm
features:
- agent-thought
- tool-call
- multi-tool-call
- stream-tool-call
- vision
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 4096
  min: 1
  max: 65536
- name: presence_penalty
  use_template: presence_penalty
  help:
    zh_Hans: 该模型不支持此参数，开启了也不生效，不影响正常调用
    en_US: Not supported by this model. Ignored if set; calls still work.
- name: frequency_penalty
  use_template: frequency_penalty
  help:
    zh_Hans: 该模型不支持此参数，开启了也不生效，不影响正常调用
    en_US: Not supported by this model. Ignored if set; calls still work.
pricing:
  input: '0.795'
  output: '3.975'
  unit: '0.000001'
  currency: USD
