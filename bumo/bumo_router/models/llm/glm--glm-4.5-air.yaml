model: glm/glm-4.5-air
label:
  en_US: glm/glm-4.5-air
model_type: llm
features:
- agent-thought
- tool-call
- multi-tool-call
- stream-tool-call
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 4096
  min: 1
  max: 65536
- name: presence_penalty
  use_template: presence_penalty
- name: frequency_penalty
  use_template: frequency_penalty
pricing:
  input: '0.8'
  output: '6'
  unit: '0.000001'
  currency: RMB
