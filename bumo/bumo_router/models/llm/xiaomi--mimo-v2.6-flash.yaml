model: xiaomi/mimo-v2.6-flash
label:
  en_US: xiaomi/mimo-v2.6-flash
model_type: llm
features:
- agent-thought
- tool-call
- multi-tool-call
- stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 4096
  min: 1
  max: 65536
- name: presence_penalty
  use_template: presence_penalty
- name: frequency_penalty
  use_template: frequency_penalty
pricing:
  input: '1'
  output: '2'
  unit: '0.000001'
  currency: RMB
